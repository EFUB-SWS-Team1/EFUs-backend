name: CD

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  IMAGE_NAME: kkangchong/efus-backend

jobs:
  build-and-push:
    name: Build, Test and Push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build and test
        run: ./gradlew clean build --no-daemon

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Configure SSH
        shell: bash
        run: |
          mkdir -p ~/.ssh

          printf '%s' "${{ secrets.EC2_KEY }}" > ~/.ssh/efus.pem
          chmod 600 ~/.ssh/efus.pem

          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Prepare deployment directory
        shell: bash
        run: |
          ssh \
            -i ~/.ssh/efus.pem \
            "${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }}" \
            "mkdir -p /home/ubuntu/efus-app"

      - name: Upload Compose file
        shell: bash
        run: |
          scp \
            -i ~/.ssh/efus.pem \
            compose.yaml \
            "${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }}:/home/ubuntu/efus-app/compose.yaml"

      - name: Deploy latest image
        shell: bash
        run: |
          ssh -T \
            -i ~/.ssh/efus.pem \
            "${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }}" \
            'bash -s' <<'EOF'

          set -euo pipefail

          cd /home/ubuntu/efus-app

          sudo docker compose -f compose.yaml config -q
          sudo docker compose -f compose.yaml pull

          sudo docker compose -f compose.yaml up -d \
            --force-recreate \
            --remove-orphans

          echo "백엔드 서버 시작 대기 중..."

          SUCCESS=false

          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/api/health > /dev/null; then
              echo "배포 및 헬스체크 성공"
              SUCCESS=true
              break
            fi

            echo "헬스체크 대기 중... (${attempt}/30)"
            sleep 5
          done

          if [ "$SUCCESS" != "true" ]; then
            echo "헬스체크 실패"
            sudo docker compose -f compose.yaml ps
            sudo docker compose -f compose.yaml logs --tail=200 backend
            exit 1
          fi

          sudo docker compose -f compose.yaml ps
          sudo docker image prune -f

          echo "CD 완료"
          EOF