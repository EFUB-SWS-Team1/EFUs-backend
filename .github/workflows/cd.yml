name: CD

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: true

env:
  IMAGE_NAME: kkangchong/efus-backend

jobs:
  build-and-push:
    name: Build, Test and Push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build and test
        run: ./gradlew clean build --no-daemon

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Configure SSH
        shell: bash
        run: |
          mkdir -p ~/.ssh

          printf '%s' "${{ secrets.EC2_KEY }}" > ~/.ssh/efus.pem
          chmod 600 ~/.ssh/efus.pem

          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Upload Compose file
        shell: bash
        run: |
          scp \
            -i ~/.ssh/efus.pem \
            compose.yaml \
            "${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }}:/home/ubuntu/efus-app/compose.yaml"

      - name: Deploy latest image
        shell: bash
        run: |
          ssh \
            -i ~/.ssh/efus.pem \
            "${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }}" << 'EOF'
          set -euo pipefail

          cd /home/ubuntu/efus-app

          sudo docker compose config -q
          sudo docker compose pull
          sudo docker compose up -d --remove-orphans

          sleep 15

          sudo docker compose ps
          sudo docker compose ps --status running --services | grep -qx backend

          sudo docker image prune -f
          EOF