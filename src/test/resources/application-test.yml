spring:
  datasource:
    url: jdbc:h2:mem:efus;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: false

cloud:
  aws:
    region: ap-northeast-2
    s3:
      bucket: test-bucket
    credentials:
      access-key: test-access-key
      secret-key: test-secret-key

kakao:
  client-id: test-kakao-client-id
  redirect-uri: http://localhost:3000/kakao/login

jwt:
  secret: TestJwtSecretKeyForEfusApplicationAtLeast32BytesLong
  access-token-validity-in-seconds: 3600
  refresh-token-validity-in-seconds: 1209600